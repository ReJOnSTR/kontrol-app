name: Supabase Unified Backup (DB & Storage)

on:
  schedule:
    # Her gece 02:00 UTC (TSİ 05:00) otomatik tam yedek
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      backup_type:
        description: 'Yedekleme Türü'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - db_only
          - storage_only

permissions:
  contents: read

jobs:
  backup:
    name: Supabase Enterprise Backup
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Run Unified Backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION || 'auto' }}
        run: |
          mkdir -p backups
          BACKUP_TYPE="${{ github.event.inputs.backup_type || 'full' }}"
          if [ "$BACKUP_TYPE" = "db_only" ]; then
            node scripts/supabase-backup-manager.js backup-db
          elif [ "$BACKUP_TYPE" = "storage_only" ]; then
            node scripts/supabase-backup-manager.js backup-storage
          else
            node scripts/supabase-backup-manager.js backup
          fi

      - name: Upload Backup Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: supabase-unified-backup-${{ github.run_id }}
          path: backups/kontrol_*
          retention-days: 30
          if-no-files-found: error
